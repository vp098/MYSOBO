<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#287A4B" />
<title>SOBO · Offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #FCFEFB; color: #1A231C; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 18px 0 8px; font-size: 24px; }
  p { margin: 0 0 20px; color: #4A544C; line-height: 1.5; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #287A4B; color: #fff; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="SOBO" />
  <h1>You are offline</h1>
  <p>SOBO needs an internet connection to show local businesses. Check your connection and try again.</p>
  <p lang="gu">ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
